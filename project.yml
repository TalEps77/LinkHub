name: LinkHub
options:
  bundleIdPrefix: com.linkhub
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true
  defaultConfig: Release
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

# Story 4.3: Sparkle 2 is the first and only SPM dependency (NFR36). Pinned to the 2.x major via
# `from` so XcodeGen resolves the latest compatible 2.x at generate time.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_LANGUAGE: en
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: YES
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_IDENTITY: "-"
      STRIP_INSTALLED_PRODUCT: NO
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      ENABLE_TESTABILITY: NO
      GCC_PREPROCESSOR_DEFINITIONS: ""
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_IDENTITY: ""
      STRIP_INSTALLED_PRODUCT: YES
      ONLY_ACTIVE_ARCH: NO
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

targets:
  LinkHub:
    type: application
    platform: macOS
    sources:
      - path: LinkHub
        excludes:
          - "Info.plist"
          - "LinkHub.entitlements"
          - "**/.gitkeep"
      - path: LinkHub/MenuBar
        type: group
        optional: true
      - path: LinkHub/Network/Models
        type: group
        optional: true
      - path: LinkHub/State
        type: group
        optional: true
      - path: LinkHub/Services
        type: group
        optional: true
      - path: LinkHub/Utilities
        type: group
        optional: true
      - path: LinkHub/UI/Components
        type: group
        optional: true
      - path: LinkHub/UI/Panels
        type: group
        optional: true
      - path: LinkHub/UI/Windows
        type: group
        optional: true
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: LinkHub
        PRODUCT_BUNDLE_IDENTIFIER: com.linkhub.app
        INFOPLIST_FILE: LinkHub/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_ENTITLEMENTS: LinkHub/LinkHub.entitlements
          PROVISIONING_PROFILE_SPECIFIER: ""

  LinkHubTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LinkHubTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: LinkHub
    settings:
      base:
        PRODUCT_NAME: LinkHubTests
        PRODUCT_BUNDLE_IDENTIFIER: com.linkhub.app.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LinkHub.app/Contents/MacOS/LinkHub"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  LinkHub:
    build:
      targets:
        LinkHub: all
        LinkHubTests: [test]
      parallelizeBuild: true
      buildImplicitDependencies: true
    run:
      config: Debug
      diagnostics:
        mainThreadChecker: true
        threadSanitizer: false
    test:
      config: Debug
      targets:
        - LinkHubTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
